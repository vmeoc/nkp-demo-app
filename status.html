<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Statut de déploiement NKP</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --ink: #1f2937;
      --muted: #6b7280;
      --line: #dbe3ee;
      --accent: #4f46e5;
      --ok: #16a34a;
      --run: #7c3aed;
      --fail: #dc2626;
      --block: #d97706;
      --pending: #9ca3af;
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(79, 70, 229, 0.12), transparent 32%),
        radial-gradient(circle at top right, rgba(22, 163, 74, 0.10), transparent 28%),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .page { width: min(1240px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 48px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
    h1 { margin: 0; font-size: 30px; letter-spacing: -0.03em; }
    .meta { color: var(--muted); font-size: 13px; }
    button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 9px 15px; cursor: pointer; box-shadow: var(--shadow); }
    button:hover { transform: translateY(-1px); }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; box-shadow: var(--shadow); }
    .pipeline-wrap { overflow-x: auto; padding: 8px 4px 18px; }
    .pipeline {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      min-width: 760px;
    }
    .step {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
    }
    .node {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 22px;
      font-weight: 700;
      background: #fff;
      border: 4px solid var(--pending);
      color: var(--pending);
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
      transition: all 180ms ease;
    }
    .step.success .node { border-color: var(--ok); color: var(--ok); background: #f0fdf4; }
    .step.running .node { border-color: var(--run); color: var(--run); background: #f5f3ff; animation: pulse 1.6s ease-in-out infinite; }
    .step.failed .node { border-color: var(--fail); color: var(--fail); background: #fef2f2; }
    .step.blocked .node { border-color: var(--block); color: var(--block); background: #fffbeb; }
    .step.pending .node { border-color: var(--pending); color: var(--pending); background: #f9fafb; }
    .label { font-size: 13px; font-weight: 650; }
    .step-status { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .connector {
      flex: 0 0 46px;
      height: 4px;
      margin-top: 27px;
      border-radius: 999px;
      background: #e5e7eb;
      position: relative;
    }
    .connector::after {
      content: "";
      position: absolute;
      right: -7px;
      top: -4px;
      border: 6px solid transparent;
      border-left-color: #e5e7eb;
    }
    .connector.active {
      background: linear-gradient(90deg, var(--ok), #86efac);
    }
    .connector.active::after { border-left-color: #86efac; }
    .connector.running {
      background: linear-gradient(90deg, var(--run), #c4b5fd);
    }
    .connector.running::after { border-left-color: #c4b5fd; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 8px 18px rgba(124, 58, 237, 0.18); }
      50% { transform: scale(1.06); box-shadow: 0 10px 24px rgba(124, 58, 237, 0.30); }
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; margin-top: 18px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
    .card h2 { margin: 0 0 10px; font-size: 15px; }
    .badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 650; border: 1px solid var(--line); }
    .badge.ok { color: var(--ok); border-color: #bbf7d0; background: #f0fdf4; }
    .badge.run { color: var(--run); border-color: #ddd6fe; background: #f5f3ff; }
    .badge.fail { color: var(--fail); border-color: #fecaca; background: #fef2f2; }
    .badge.block { color: var(--block); border-color: #fde68a; background: #fffbeb; }
    .badge.pending { color: var(--pending); border-color: var(--line); background: #f9fafb; }
    .detail { color: var(--muted); font-size: 13px; margin-top: 8px; line-height: 1.5; word-break: break-word; }
    .section { margin-top: 28px; }
    .section h2 { margin: 0 0 12px; font-size: 18px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    a { color: var(--accent); text-decoration: none; font-weight: 600; }
    a:hover { text-decoration: underline; }
    pre { white-space: pre-wrap; word-break: break-word; background: #f8fafc; border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 12px; max-height: 320px; overflow: auto; }
    .error { color: var(--fail); }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 760px) { .two { grid-template-columns: 1fr; } .pipeline { min-width: 680px; } }
    .event { border-left: 4px solid var(--line); padding: 10px 12px; margin-bottom: 10px; border-radius: 0 10px 10px 0; background: #f8fafc; }
    .event.ok { border-color: var(--ok); }
    .event.run { border-color: var(--run); }
    .event.fail { border-color: var(--fail); }
    .event.block { border-color: var(--block); }
    .event.pending { border-color: var(--pending); }
    .event .when { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <h1>Statut de déploiement NKP</h1>
        <div class="meta" id="updated">Chargement…</div>
      </div>
      <button id="refresh">Rafraîchir</button>
    </header>

    <section class="panel">
      <div class="pipeline-wrap">
        <div class="pipeline" id="pipeline-visual"></div>
      </div>
      <div class="grid" id="pipeline-cards"></div>
    </section>

    <section class="section">
      <h2>Historique des builds (GitHub Actions)</h2>
      <div class="panel" id="history">Chargement…</div>
    </section>

    <section class="section two">
      <div class="panel">
        <h2>Journal d’orchestration IA</h2>
        <div id="timeline">Chargement…</div>
      </div>
      <div class="panel">
        <h2>Code / contrat actuels</h2>
        <div class="detail" id="greeting"></div>
        <pre id="contract">Chargement…</pre>
      </div>
    </section>

    <section class="section">
      <h2>Erreurs</h2>
      <pre id="errors">Aucune erreur détectée.</pre>
    </section>
  </div>

  <script>
    const OWNER = "vmeoc";
    const REPO = "nkp-demo-app";
    const BRANCH = "main";
    const RAW = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}`;
    const API = `https://api.github.com/repos/${OWNER}/${REPO}`;
    const REFRESH_MS = 60000;

    const state = {
      greeting: "",
      contract: "",
      deployLog: [],
      runs: [],
      health: null,
      healthError: "",
      latestSha: null,
      targetVersion: null,
      errors: []
    };

    const $ = (id) => document.getElementById(id);

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    async function fetchText(url) {
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error(`${res.status} ${res.statusText} for ${url}`);
      return res.text();
    }

    async function fetchJson(url) {
      const res = await fetch(url, { cache: "no-store", headers: { Accept: "application/vnd.github+json" } });
      if (!res.ok) throw new Error(`${res.status} ${res.statusText} for ${url}`);
      return res.json();
    }

    function badge(status) {
      const labels = { success: "succès", running: "en cours", failed: "échec", blocked: "bloqué", pending: "en attente" };
      return `<span class="badge ${status}">${labels[status] || status}</span>`;
    }

    function ciStatus() {
      const run = state.runs[0];
      if (!run) return "pending";
      if (run.status !== "completed") return "running";
      return run.conclusion === "success" ? "success" : "failed";
    }

    function aiStatus() {
      if (!state.deployLog.length) return "pending";
      if (state.deployLog.some((e) => e.status === "failed")) return "failed";
      const last = state.deployLog[state.deployLog.length - 1];
      if (last.step === "bootstrap") return "pending";
      if (last.status === "success") return "success";
      if (last.status === "running") return "running";
      return "pending";
    }

    function gitPushStatus() {
      if (state.runs.length > 0) return "success";
      if (state.deployLog.some((e) => e.step === "push" && e.status === "success")) return "success";
      return "pending";
    }

    function healthStatus() {
      if (state.healthError) return "failed";
      if (!state.health) return "pending";
      if (state.targetVersion && state.health.version === state.targetVersion) return "success";
      return "running";
    }

    function fluxStatus() {
      const ci = ciStatus();
      if (ci === "failed") return "blocked";
      if (ci !== "success") return "pending";
      const hs = healthStatus();
      if (hs === "success") return "success";
      if (hs === "failed") return "failed";
      return "running";
    }

    function rolloutStatus() {
      return fluxStatus();
    }

    function developerStatus() {
      return state.greeting ? "success" : "pending";
    }

    const steps = [
      { key: "developer", title: "Code développeur", icon: "💻" },
      { key: "ai", title: "Orchestration IA", icon: "🤖" },
      { key: "git", title: "Push Git", icon: "🔀" },
      { key: "ci", title: "CI GitHub", icon: "⚙️" },
      { key: "flux", title: "Flux", icon: "🔄" },
      { key: "rollout", title: "Rollout NKP", icon: "🚀" },
      { key: "health", title: "Health check", icon: "❤️" }
    ];

    function stepStatus(key) {
      return {
        developer: developerStatus(),
        ai: aiStatus(),
        git: gitPushStatus(),
        ci: ciStatus(),
        flux: fluxStatus(),
        rollout: rolloutStatus(),
        health: healthStatus()
      }[key];
    }

    function connectorClass(previousKey) {
      const s = stepStatus(previousKey);
      if (s === "success") return "connector active";
      if (s === "running") return "connector running";
      return "connector";
    }

    function renderVisual() {
      const nodes = steps.map((step, index) => {
        const status = stepStatus(step.key);
        const connector = index < steps.length - 1
          ? `<div class="${connectorClass(step.key)}"></div>`
          : "";
        return `
          <div class="step ${status}">
            <div class="node">${step.icon}</div>
            <div class="label">${escapeHtml(step.title)}</div>
            <div class="step-status">${status}</div>
          </div>
          ${connector}
        `;
      }).join("");
      $("pipeline-visual").innerHTML = nodes;
    }

    function card(title, status, detail) {
      return `
        <article class="card">
          <h2>${escapeHtml(title)}</h2>
          ${badge(status)}
          <div class="detail">${detail}</div>
        </article>
      `;
    }

    function renderCards() {
      const ci = ciStatus();
      const run = state.runs[0];
      const ciDetail = run
        ? `Run #${run.run_number} — ${escapeHtml(run.status)}${run.conclusion ? " / " + escapeHtml(run.conclusion) : ""}<br>Commit ${escapeHtml((run.head_sha || "").slice(0, 7))}<br><a href="${escapeHtml(run.html_url)}" target="_blank" rel="noopener">Voir le run</a>`
        : "Aucun run GitHub Actions trouvé.";
      const healthDetail = state.healthError
        ? `<span class="error">${escapeHtml(state.healthError)}</span>`
        : state.health
          ? `Version déployée : ${escapeHtml(state.health.version)}${state.targetVersion ? "<br>Version attendue : " + escapeHtml(state.targetVersion) : ""}`
          : "Endpoint /healthz non disponible.";
      const fluxDetail = ci === "failed"
        ? "Bloqué : la CI a échoué."
        : ci !== "success"
          ? "En attente de la fin de la CI."
          : healthStatus() === "success"
            ? "Manifests appliqués et application prête."
            : healthStatus() === "failed"
              ? "Échec lors de l’application ou du rollout."
              : "Application des manifests en cours.";
      const rolloutDetail = ci === "failed"
        ? "Arrêté : pas de rollout après l’échec de la CI."
        : ci !== "success"
          ? "En attente."
          : healthStatus() === "success"
            ? "Pods prêts et health check OK."
            : healthStatus() === "failed"
              ? "Rollout échoué ou timeout."
              : "Rollout en cours.";

      $("pipeline-cards").innerHTML = [
        card("1. Code développeur", developerStatus(), `Greeting détecté : ${escapeHtml(state.greeting || "non trouvé")}`),
        card("2. Orchestration IA", aiStatus(), state.deployLog.length ? `Dernier événement : ${escapeHtml(state.deployLog[state.deployLog.length - 1].step)} (${escapeHtml(state.deployLog[state.deployLog.length - 1].status)})` : "Aucun événement d’orchestration enregistré."),
        card("3. Push Git", gitPushStatus(), state.runs.length ? "Push détecté via les runs GitHub Actions." : "Aucun push détecté."),
        card("4. CI GitHub Actions", ci, ciDetail),
        card("5. Flux / manifests", fluxStatus(), fluxDetail),
        card("6. Rollout NKP", rolloutStatus(), rolloutDetail),
        card("7. Health check", healthStatus(), healthDetail)
      ].join("");
    }

    function renderHistory() {
      if (!state.runs.length) {
        $("history").innerHTML = "Aucun historique disponible.";
        return;
      }
      const rows = state.runs.map((run) => `
        <tr>
          <td>${badge(run.status !== "completed" ? "running" : (run.conclusion === "success" ? "success" : "failed"))}</td>
          <td>#${escapeHtml(run.run_number)}</td>
          <td>${escapeHtml((run.head_sha || "").slice(0, 7))}</td>
          <td>${escapeHtml(new Date(run.created_at).toLocaleString())}</td>
          <td><a href="${escapeHtml(run.html_url)}" target="_blank" rel="noopener">run</a></td>
        </tr>
      `).join("");
      $("history").innerHTML = `
        <table>
          <thead><tr><th>État</th><th>Run</th><th>Commit</th><th>Créé</th><th>Lien</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    function renderTimeline() {
      if (!state.deployLog.length) {
        $("timeline").innerHTML = "Aucun événement.";
        return;
      }
      $("timeline").innerHTML = state.deployLog.slice().reverse().map((event) => `
        <div class="event ${escapeHtml(event.status || "pending")}">
          <div><strong>${escapeHtml(event.step || "étape")}</strong> — ${escapeHtml(event.status || "pending")}</div>
          <div>${escapeHtml(event.message || "")}</div>
          <div class="when">${escapeHtml(event.timestamp || "")}</div>
        </div>
      `).join("");
    }

    function renderSources() {
      $("greeting").textContent = state.greeting ? `Greeting actuel : ${state.greeting}` : "Greeting non trouvé.";
      $("contract").textContent = state.contract || "Contrat non trouvé.";
    }

    function renderErrors() {
      $("errors").textContent = state.errors.length ? state.errors.join("\n") : "Aucune erreur détectée.";
    }

    function render() {
      renderVisual();
      renderCards();
      renderHistory();
      renderTimeline();
      renderSources();
      renderErrors();
      $("updated").textContent = `Dernière mise à jour : ${new Date().toLocaleString()}`;
    }

    async function loadAll() {
      state.errors = [];
      const results = await Promise.allSettled([
        fetchText(`${RAW}/index.html`),
        fetchText(`${RAW}/nkp-app.yaml`),
        fetchJson(`${RAW}/deploy-log.json`),
        fetchJson(`${API}/actions/workflows/build-deploy.yml/runs?branch=${BRANCH}&per_page=10`),
        fetchJson(`${API}/commits/${BRANCH}`),
        fetch("/healthz", { cache: "no-store" }).then(async (res) => {
          if (!res.ok) throw new Error(`healthz ${res.status}`);
          return res.json();
        })
      ]);

      const [indexRes, contractRes, logRes, runsRes, commitRes, healthRes] = results;

      if (indexRes.status === "fulfilled") {
        const match = indexRes.value.match(/<h1[^>]*>([\s\S]*?)<\/h1>/i);
        state.greeting = match ? match[1].replace(/<[^>]+>/g, "").trim() : "";
      } else {
        state.errors.push(`Code : ${indexRes.reason.message}`);
      }

      if (contractRes.status === "fulfilled") {
        state.contract = contractRes.value;
      } else {
        state.errors.push(`Contrat : ${contractRes.reason.message}`);
      }

      if (logRes.status === "fulfilled" && Array.isArray(logRes.value)) {
        state.deployLog = logRes.value;
      } else if (logRes.status === "rejected") {
        state.errors.push(`Journal : ${logRes.reason.message}`);
      }

      if (runsRes.status === "fulfilled") {
        state.runs = runsRes.value.workflow_runs || [];
      } else {
        state.errors.push(`GitHub Actions : ${runsRes.reason.message}`);
      }

      if (commitRes.status === "fulfilled") {
        state.latestSha = commitRes.value.sha || null;
      }

      if (healthRes.status === "fulfilled") {
        state.health = healthRes.value;
        state.healthError = "";
      } else {
        state.health = null;
        state.healthError = healthRes.reason.message;
      }

      const successfulRun = state.runs.find((run) => run.conclusion === "success");
      state.targetVersion = successfulRun ? (successfulRun.head_sha || "").slice(0, 7) : (state.latestSha ? state.latestSha.slice(0, 7) : null);

      render();
    }

    let timer = null;
    function schedule() {
      clearTimeout(timer);
      timer = setTimeout(loadAll, REFRESH_MS);
    }

    $("refresh").addEventListener("click", () => {
      clearTimeout(timer);
      loadAll().then(schedule);
    });

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        clearTimeout(timer);
        loadAll().then(schedule);
      }
    });

    loadAll().then(schedule);
  </script>
</body>
</html>
