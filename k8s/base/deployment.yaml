# GÉNÉRÉ par render.py depuis nkp-app.yaml. Ne pas modifier à la main.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: basket-jereme
  labels:
    app.kubernetes.io/name: basket-jereme
    app.kubernetes.io/managed-by: nkp-deploy
    nkp.demo/env: dev
    nkp.demo/owner: vincentm
    nkp.demo/archi: stateless
    nkp.demo/backup: daily
    nkp.demo/tracing: enabled
    nkp.demo/llm: none
    nkp.demo/cost-center: test3
    nkp.demo/expires: '2026-12-31'
  annotations:
    nkp.demo/backup-policy: quotidienne 02:00, rétention 7 jours (simulé)
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: basket-jereme
  template:
    metadata:
      labels:
        app.kubernetes.io/name: basket-jereme
        app.kubernetes.io/managed-by: nkp-deploy
        nkp.demo/env: dev
        nkp.demo/owner: vincentm
        nkp.demo/archi: stateless
        nkp.demo/backup: daily
        nkp.demo/tracing: enabled
        nkp.demo/llm: none
        nkp.demo/cost-center: test3
        nkp.demo/expires: '2026-12-31'
      annotations:
        instrumentation.opentelemetry.io/inject-python: 'true'
    spec:
      containers:
      - name: basket-jereme
        image: app-image
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: APP_ENV
          value: dev
        - name: OTEL_SERVICE_NAME
          value: basket-jereme
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
